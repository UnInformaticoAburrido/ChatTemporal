# Configurar proveedor y destinatario reales antes de producción; nunca contraseñas aquí.
global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.example.invalid:587
  smtp_from: chat-alerts@example.invalid
  smtp_auth_username: chat-alerts@example.invalid
  smtp_auth_password_file: /run/secrets/alertmanager_smtp_password
  smtp_require_tls: true
route:
  receiver: oncall
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: oncall
    email_configs:
      - to: operaciones@example.invalid
        send_resolved: true
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="high"']
    equal: [alertname, instance]

# DEC-06: valores iniciales conservadores para el host de 2–4 GiB (§20).
listen_addresses = '*'
max_connections = 50
shared_buffers = 128MB
password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'
# §30.3: sentencias y parámetros pueden contener ciphertext/secretos.
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

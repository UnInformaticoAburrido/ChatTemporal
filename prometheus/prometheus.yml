global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: chat
    static_configs:
      - targets: ['python:8000']
  - job_name: worker
    static_configs:
      - targets: ['worker:8001']
  - job_name: host
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: tls
    metrics_path: /probe
    params:
      module: [https]
    static_configs:
      - targets: ['https://chat.example.invalid/health/live']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

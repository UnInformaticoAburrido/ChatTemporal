[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requiere PostgreSQL y Redis reales"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["chat", "chat_client"]

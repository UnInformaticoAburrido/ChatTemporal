[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requiere PostgreSQL y Redis reales"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["chat", "chat_client"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["chat", "chat_client"]

[tool.coverage.run]
source = ["chat", "chat_client"]
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 85

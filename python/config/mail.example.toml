# Copia como mail.local.toml. Edita solo esa copia, excluida de Git y Docker.
enabled = false
host = "smtp.gmail.com"
port = 587
# "starttls" normalmente en 587; "tls" para TLS directo, normalmente 465.
security = "starttls"
sender = "usuario@gmail.com"

# OAuth2 de Gmail: no se utiliza una contraseña SMTP.
auth_method = "oauth2"
client_id = ""
client_secret = ""
refresh_token = ""

# Para SMTP tradicional, cambia auth_method a "password", elimina los tres
# campos OAuth2 anteriores y añade username y password con tus datos privados.
# La configuración antigua sin auth_method sigue usando contraseña.
